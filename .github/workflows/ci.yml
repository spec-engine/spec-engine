name: CI

on:
  pull_request: {}
  push:
    branches: [main]
    tags: ['v*']  # PUB-01: a version tag re-runs every gate, then publishes

permissions:
  contents: read

# 2.2: cancel superseded runs on the same ref so a rapid push sequence doesn't
# run stale commits to completion on the 10x-priced macOS runner. `main` pushes
# and PR updates each get their own group keyed by ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build & smoke (darwin-arm64)
    runs-on: macos-14  # Apple Silicon runner — matches D-13 target
    timeout-minutes: 20  # 2.2: cap a hung background `spec serve` smoke (default is 6h)
    # 2.1 / 2.2: this job now does ONLY what needs the darwin-arm64 compiled
    # binary — build:cli + the compiled-binary smokes + secret-scan. Lint,
    # type-check, the unit suite, and the source-grep architecture fences (now
    # scripts/arch-fences.sh, run by architecture-fences.test.ts) are all
    # platform-independent and run once on the ubuntu `test-linux` job.

    steps:
      - uses: actions/checkout@v5

      - name: setup Bun (reads .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: assert Bun pin matches
        run: |
          pinned=$(cat .bun-version)
          installed=$(bun --version)
          test "$pinned" = "$installed" || { echo "Bun mismatch: pinned=$pinned installed=$installed"; exit 1; }

      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: build compiled binary
        run: bun run build:cli
        # Post-Phase-18 (STOR-04 / D2): the shipped binary indexes SPEC.json
        # ONLY — the Markdown parse path is deleted. Smokes 6/6b/7 below drive
        # `spec index` + `spec check` over fixtures/platform-fixture (now
        # JSON-only after 18-03), so they exercise the JSON reader end-to-end
        # in the compiled artifact, proving the cutover in the real binary.

      - name: upload compiled binary (2.2 — reproduce a red smoke against the exact artifact)
        if: always()  # upload even when a later smoke fails — that's when you need it
        uses: actions/upload-artifact@v4
        with:
          name: spec-darwin-arm64
          path: dist/spec
          if-no-files-found: warn
          retention-days: 7

      - name: smoke 1 — --help exits 0 and prints usage
        run: bash scripts/smoke/01-help.sh

      - name: smoke 2 — --version exits 0 and prints semver
        run: bash scripts/smoke/02-version.sh

      - name: smoke 3 — open fresh DB, assert schema shape
        run: bash scripts/smoke/03-schema-shape.sh

      - name: smoke 4 — schema-version mismatch triggers silent rebuild
        run: bash scripts/smoke/04-schema-mismatch.sh

      - name: smoke 5 — compiled binary serves embedded webapp HTML
        run: bash scripts/smoke/05-serve-probe.sh

      - name: smoke 6 — cold-rebuild build_id equivalence (CI-02 / INDX-03)
        run: bash scripts/smoke/06-cold-rebuild.sh

      - name: smoke 6b — cold-rebuild build_id byte-stable WITH skipped sibling (BUILD-01)
        run: bash scripts/smoke/06b-cold-rebuild-stray-sibling.sh

      - name: smoke 7 — inverted CI assertion (CHCK-04 / CI-03)
        run: bash scripts/smoke/07-inverted-ci.sh

      - name: smoke 8a — spec get / spec list against fixture (compiled binary) [MAP-003, MAP-004]
        run: bash scripts/smoke/08a-get-list.sh

      - name: smoke 8 — spec propagation against fixture (compiled binary) [PROP-03]
        run: bash scripts/smoke/08-propagation.sh

      - name: smoke 9 — spec query against fixture (compiled binary) [QURY-02]
        run: bash scripts/smoke/09-query.sh

      - name: "smoke 10 — spec resolve against fixture (compiled binary) [RSLV-01 / RSLV-02]"
        run: bash scripts/smoke/10-resolve.sh

      - name: "smoke 11 — spec serve compiled binary serves /api/coverage + / (SERV-01 / SERV-04)"
        run: bash scripts/smoke/11-serve.sh

      - name: "smoke 12 — spec gate PASS against fixture (compiled binary) [GATE-01]"
        run: bash scripts/smoke/12-gate-pass.sh

      - name: "smoke 13 — spec gate distinct failure reasons (compiled binary) [GATE-02]"
        run: bash scripts/smoke/13-gate-reasons.sh

      - name: smoke 14 — spec init scaffolds in tmp + idempotent (CI-04 / INIT-09 / INIT-10)
        run: bash scripts/smoke/14-init.sh

      - name: smoke 14b — fixture unchanged after spec init smokes (CI-04 / WR-06 belt-and-suspenders)
        run: bash scripts/smoke/14b-fixture-unchanged.sh

      - name: smoke 15 — NO_SPEC_CONFIG end-to-end on ad-hoc tmp platform (CI-04 / DISC-03 / DIAG-02)
        run: bash scripts/smoke/15-no-spec-config.sh

      - name: smoke 16 — dogfood self-gate, trusted-red (spec on spec, rung 2)
        run: bash scripts/smoke/16-self-gate.sh

      - name: "smoke 17 — spec provenance against fixture (compiled binary) [PMAT-01/02/03]"
        run: bash scripts/smoke/17-provenance.sh

      - name: "smoke 18 — UNSOURCED_CHANGE off-by-default + flagged set (compiled binary) [USRC-02/04]"
        run: bash scripts/smoke/18-unsourced-change.sh

      - name: "smoke 19 — tracker build_id parity (TRK-07 — build_id independent of tracker reachability)"
        run: bash scripts/smoke/19-tracker-parity.sh

      - name: "smoke 20 — provenance --resolve-issues degraded + /provenance served (compiled binary) [PWEB-01/02/03]"
        run: bash scripts/smoke/20-provenance-resolve-serve.sh

      - name: "smoke 21 — trusted-red build_id parity with/without --results (compiled binary) [GATE-04]"
        run: bash scripts/smoke/21-results-parity.sh

      - name: "smoke 22 — trusted-red --results fires UNPROVEN_REQ (compiled binary) [GATE-02 / GATE-04]"
        run: bash scripts/smoke/22-results-unproven.sh

      - name: "smoke 23 — GATE-05 no-results --json baseline re-verify (compiled binary) [GATE-05]"
        run: bash scripts/smoke/23-no-results-baseline.sh

      - name: "smoke 24 — governance build_id parity with/without --base (compiled binary) [GATE-04]"
        run: bash scripts/smoke/24-base-parity.sh

      - name: "smoke 25 — governance-red on a cold build: REQUIREMENT_REMOVED + exit 1 (compiled binary) [GOV-01 / GOV-03]"
        run: bash scripts/smoke/25-governance-red.sh

      - name: secret-scan against compiled binary (T-1-02 mitigation)
        run: |
          if strings dist/spec 2>/dev/null | grep -E '(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|xox[bp]-[a-zA-Z0-9-]+|ghp_[a-zA-Z0-9]{36}|AIza[0-9A-Za-z_-]{35})' >/dev/null 2>&1; then
            echo "FORBIDDEN: compiled binary appears to contain a secret-shaped string"
            exit 1
          fi

  # Linux coverage of the engine: lint, type-check, and the full unit suite.
  # The binary smokes stay darwin-only above (D-13 target); this job exists
  # so a Linux-only regression (path handling, sqlite build, glob behavior)
  # cannot land green.
  test-linux:
    name: lint, type-check & unit tests (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 2.2

    steps:
      - uses: actions/checkout@v5

      - name: setup Bun (reads .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: lint (biome)
        run: bun run check

      - name: shellcheck (scripts/)
        run: shellcheck scripts/*.sh scripts/smoke/*.sh

      - name: type-check
        run: bun run typecheck

      - name: unit tests (bun test)
        run: bun run test
  site:
    name: docs site build (astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 2.2
    # 1.3: the site had zero CI coverage, so a rename broke its logo asset paths
    # and nobody noticed (a stale local dist/ masked it). This job fails the
    # build if the site can't compile — the cheapest guard against silent rot.
    # The site is now the `@spec-engine/site` workspace package, so it installs
    # from the ROOT lockfile like every other package.

    steps:
      - uses: actions/checkout@v5

      - name: setup Bun (reads .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install (frozen lockfile, root workspace)
        run: bun install --frozen-lockfile

      - name: build (astro build — fails on a missing asset/broken ref)
        run: bun run build:site

  # PUB-01 (mirrors platform-map): tag-gated keyless npm publish via OIDC
  # trusted publishing. No stored token — `id-token: write` mints a
  # short-lived OIDC credential per run; provenance auto-attaches from
  # publishConfig.provenance in packages/engine/package.json.
  #
  # BUN PACKS, NPM PUBLISHES. packages/engine's devDependencies use the
  # workspace: protocol, which npm cannot rewrite, and `bun publish` has no
  # OIDC flow (token/web auth only). So `bun pm pack` builds the tarball —
  # running prepack (build:npm) and rewriting workspace: deps, the two
  # invariants CONTRIBUTING's release rules protect — and npm publishes that
  # EXACT gate-validated artifact. npm bundled with Node 22 is 10.x, which
  # silently falls back to token auth and dies ENEEDAUTH — the explicit
  # upgrade to >= 11.5.1 is load-bearing.
  #
  # One-time operator gate: register the GitHub trusted publisher for
  # @spec-engine/spec-engine on npmjs.com (org/user: spec-engine,
  # repository: spec-engine, workflow filename: ci.yml, no environment)
  # BEFORE the first tagged run.
  publish:
    name: publish to npm (tag-gated, OIDC keyless)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-smoke, test-linux, site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write  # REQUIRED for npm OIDC trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: setup Bun (reads .bun-version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: tag ↔ package version parity
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -p 'require("./packages/engine/package.json").version')
          test "$TAG" = "$PKG" || {
            echo "tag v$TAG != packages/engine version $PKG — bump the version before tagging"; exit 1;
          }

      - name: "pack with bun (runs prepack, rewrites workspace: deps)"
        run: cd packages/engine && bun pm pack

      - name: rehearse the tarball (CONTRIBUTING release-loop step 3, mechanized)
        run: |
          cd packages/engine
          TARBALL=$(ls spec-engine-spec-engine-*.tgz)
          # The manifest must carry no workspace: protocol anywhere.
          if tar -xOf "$TARBALL" package/package.json | grep -q "workspace:"; then
            echo "FAIL: workspace: protocol survived in the published manifest"
            tar -xOf "$TARBALL" package/package.json; exit 1
          fi
          # The file list must be dist/ + package.json/README.md/LICENSE only.
          BAD=$(tar -tf "$TARBALL" | grep -vE '^package/(dist/|package\.json$|README\.md$|LICENSE$)' || true)
          test -z "$BAD" || { echo "FAIL: unexpected files in tarball:"; echo "$BAD"; exit 1; }
          echo "tarball rehearsal OK: $TARBALL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: upgrade npm for OIDC (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: publish (keyless OIDC + provenance)
        run: cd packages/engine && npm publish ./spec-engine-spec-engine-*.tgz
